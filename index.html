<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>集結開始時刻計算ツール</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1d2330; --muted: #5d6677;
    --line: #d7dbe3; --accent: #2457c5; --accent-weak: #e7eefc;
    --result: #0f6b3e; --warn: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171d; --card: #1e232c; --text: #e8ebf1; --muted: #9aa3b4;
      --line: #343b48; --accent: #7aa2ff; --accent-weak: #253250;
      --result: #6fdc9f; --warn: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
    font-size: 15px; line-height: 1.35; overflow-x: hidden;
  }
  main { max-width: 560px; margin: 0 auto; padding: 0 8px 24px; }
  input {
    font: inherit; font-size: 16px; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 6px; min-width: 0;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  input.invalid { border-color: var(--warn); outline-color: var(--warn); }
  input[type=number] { -moz-appearance: textfield; appearance: textfield; text-align: right; width: 2.7em; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

  /* 上部固定バー：到着時刻 */
  .bar {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 8px 0 6px; border-bottom: 1px solid var(--line); margin-bottom: 8px;
  }
  .bar-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .bar h1 { font-size: .95rem; margin: 0 4px 0 0; white-space: nowrap; }
  .bar .lbl { font-size: .85rem; color: var(--muted); white-space: nowrap; }
  #arrival { width: 5.4em; padding-left: 4px; padding-right: 4px; font-size: 1.15rem; font-weight: 700; font-variant-numeric: tabular-nums; text-align: center; }
  .zone { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .zone button { font: inherit; font-size: .85rem; border: 0; background: var(--card); color: var(--text); padding: 6px 8px; cursor: pointer; }
  .zone button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 700; }
  .day-badge { color: var(--accent); font-weight: 700; font-size: .9rem; white-space: nowrap; }
  .copy { margin-left: auto; font: inherit; font-size: .85rem; font-weight: 700; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; white-space: nowrap; }
  .copy.done { background: var(--result); border-color: var(--result); }
  #copy-box { width: 100%; font-size: 14px; margin-top: 6px; }
  @media (max-width: 480px) { .bar h1 { flex: 0 0 100%; margin: 0; } }
  .err { font-size: .8rem; color: var(--warn); margin: 4px 0 0; }

  /* 参加者：1人2行 */
  #list { display: grid; grid-template-columns: 1fr; gap: 6px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  .r1, .r2 { display: flex; align-items: center; gap: 6px; }
  .r1 { justify-content: space-between; }
  .r1 .name { flex: 1 1 5em; width: 5em; font-weight: 600; }
  .res { display: flex; align-items: baseline; gap: 4px; white-space: nowrap; color: var(--result); font-variant-numeric: tabular-nums; }
  .res .t { font-size: 1.55rem; font-weight: 800; line-height: 1.1; }
  .res .d, .res .z { font-size: .8rem; font-weight: 700; }
  .r2 { margin-top: 5px; flex-wrap: wrap; row-gap: 4px; column-gap: 10px; }
  .grp { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
  .grp .k { font-size: .8rem; color: var(--muted); margin-right: 2px; }
  .grp .u { font-size: .8rem; color: var(--muted); }
  .del { font: inherit; font-size: 1rem; line-height: 1; background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; width: 28px; height: 28px; padding: 0; cursor: pointer; flex: 0 0 auto; }

  .actions { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .add { flex: 1; font: inherit; font-weight: 700; padding: 8px; border-radius: 8px; border: 1px dashed var(--accent); background: var(--accent-weak); color: var(--accent); cursor: pointer; }
  .reset { font: inherit; font-size: .8rem; background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; white-space: nowrap; }
  .hint { font-size: .75rem; color: var(--muted); margin: 8px 2px 0; }
  #time-options { display: flex; gap: 8px; flex: 0 0 100%; padding: 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
  .option-column { flex: 1; min-width: 0; }
  .option-values { display: grid; grid-template-columns: repeat(2, 1fr); max-height: 8rem; overflow-y: auto; overscroll-behavior: contain; }
  .option-column:only-child .option-values { grid-template-columns: repeat(6, 1fr); }
  .option-values button { font: inherit; font-variant-numeric: tabular-nums; color: var(--text); background: var(--card); border: 0; border-radius: 4px; min-height: 38px; cursor: pointer; }
  .option-values button[aria-pressed=true] { background: var(--accent-weak); color: var(--accent); font-weight: bold; }
</style>
</head>
<body>
<main>
  <div class="bar">
    <div class="bar-row">
      <h1>集結開始時刻計算ツール</h1>
      <span class="lbl">到着</span>
      <input id="arrival" type="text" inputmode="numeric" autocomplete="off" placeholder="21:00:00" value="21:00:00" aria-label="到着したい時刻">
      <div class="zone" role="group" aria-label="タイムゾーン">
        <button type="button" id="zone-utc" aria-pressed="true">UTC</button>
        <button type="button" id="zone-jst" aria-pressed="false" title="日本時間">JST</button>
      </div>
      <span class="day-badge" id="arrival-day"></span>
      <span id="arrival-zone" hidden>UTC</span>
      <button type="button" class="copy" id="copy" title="名前と集結開始時刻の一覧をコピー">コピー</button>
    </div>
    <textarea id="copy-box" rows="4" readonly hidden aria-label="コピー用の一覧"></textarea>
    <p class="err" id="arrival-err" hidden>「21:00」か「21:00:00」の形で入力してください。</p>
  </div>

  <div id="list"></div>

  <div class="actions">
    <button type="button" class="add" id="add">＋ 参加者を追加</button>
    <button type="button" class="reset" id="reset">リセット</button>
  </div>
  <p class="hint">開始時刻 ＝ 到着 − 集結 − 移動。「21:00」は21:00:00として扱います。</p>
</main>

<template id="tpl">
  <div class="card participant">
    <div class="r1">
      <input class="name" type="text" autocomplete="off" placeholder="名前" aria-label="名前">
      <div class="res" aria-live="polite"><span class="d"></span><span class="t"></span><span class="z"></span></div>
      <button type="button" class="del" aria-label="この参加者を削除" title="削除">×</button>
    </div>
    <div class="r2">
      <span class="grp"><span class="k">移動</span><input class="tm" type="number" inputmode="numeric" min="0" step="1" value="0" aria-label="目標までの時間（分）"><span class="u">分</span><input class="ts" type="number" inputmode="numeric" min="0" step="1" value="0" aria-label="目標までの時間（秒）"><span class="u">秒</span></span>
      <span class="grp"><span class="k">集結</span><input class="rm" type="number" inputmode="numeric" min="0" step="1" value="5" aria-label="集結時間（分）"><span class="u">分</span><input class="rs" type="number" inputmode="numeric" min="0" step="1" value="0" aria-label="集結時間（秒）"><span class="u">秒</span></span>
    </div>
  </div>
</template>

<script>
(function () {
  "use strict";
  var DAY = 86400;
  var OFFSETS = { UTC: 0, JST: 9 * 3600 };
  var STORE_KEY = "rally-start-calc-v1";

  // 状態: arrival は「UTC基準日の 00:00:00 UTC」からの秒数（同じ瞬間を表す）
  var state = { zone: "UTC", arrival: 21 * 3600, people: [] };
  var nextId = 1;

  function newPerson() {
    return { id: nextId++, name: "", tm: "0", ts: "0", rm: "5", rs: "0" };
  }

  // ---- 計算・書式 ----
  function parseClock(str) {
    var s = String(str).trim()
      .replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
      .replace(/[：.．]/g, ":");
    var m = s.match(/^(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?$/);
    if (!m) {
      var d = s.match(/^(\d{3,6})$/); // 2100 / 210000 のような数字だけの入力
      if (!d) return null;
      var p = d[1].length % 2 ? "0" + d[1] : d[1];
      m = [null, p.slice(0, 2), p.slice(2, 4), p.slice(4, 6) || "0"];
    }
    var h = +m[1], mi = +m[2], se = +(m[3] || 0);
    if (h > 23 || mi > 59 || se > 59) return null;
    return h * 3600 + mi * 60 + se;
  }
  function toNum(v) {
    var s = String(v).trim();
    if (s === "") return { n: 0, ok: true };
    var n = Number(s);
    if (!isFinite(n) || n < 0 || Math.floor(n) !== n) return { n: 0, ok: false };
    return { n: n, ok: true };
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function split(absSec, zone) {
    var local = absSec + OFFSETS[zone];
    var day = Math.floor(local / DAY);
    var sod = local - day * DAY;
    return {
      day: day,
      text: pad(Math.floor(sod / 3600)) + ":" + pad(Math.floor(sod % 3600 / 60)) + ":" + pad(sod % 60)
    };
  }
  function dayLabel(day) { return ""; } // 前日・翌日の表示はしない（短時間用ツールのため）
  function zoneName(zone) { return zone === "JST" ? "JST" : "UTC"; }
  function msText(sec) { return Math.floor(sec / 60) + "分" + pad(sec % 60) + "秒"; }

  // ---- 保存（使えない環境では何もしない） ----
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return false;
      var s = JSON.parse(raw);
      if (!s || !Array.isArray(s.people) || !s.people.length || typeof s.arrival !== "number") return false;
      state.zone = s.zone === "JST" ? "JST" : "UTC";
      state.arrival = s.arrival;
      state.people = s.people.map(function (p) {
        return { id: nextId++, name: String(p.name || ""), tm: String(p.tm ?? "0"), ts: String(p.ts ?? "0"),
                 rm: String(p.rm ?? "5"), rs: String(p.rs ?? "0") };
      });
      return true;
    } catch (e) { return false; }
  }

  // ---- 画面 ----
  var $ = function (id) { return document.getElementById(id); };
  var list = $("list"), tpl = $("tpl"), arrivalInput = $("arrival");

  var panel = document.createElement("div");
  panel.id = "time-options";
  var activeInput = null;
  var timeInputs = "#arrival, .grp input";
  function closeOptions() {
    panel.remove();
    if (activeInput) activeInput.setAttribute("aria-expanded", "false");
    activeInput = null;
  }
  function selectedValues(input) {
    if (input !== arrivalInput) return [input.value === "" ? NaN : Number(input.value)];
    var seconds = parseClock(input.value);
    var text = seconds === null ? split(state.arrival, state.zone).text : split(seconds, "UTC").text;
    return text.split(":").map(Number);
  }
  function openOptions(input) {
    closeOptions();
    activeInput = input;
    input.setAttribute("aria-expanded", "true");
    panel.replaceChildren();
    var clock = input === arrivalInput;
    var units = clock ? ["時", "分", "秒"] : [input.nextElementSibling.textContent];
    var selected = selectedValues(input);
    units.forEach(function (unit, index) {
      var column = document.createElement("div");
      column.className = "option-column";
      column.textContent = unit;
      var values = document.createElement("div");
      values.className = "option-values";
      for (var n = 0; n < (unit === "時" ? 24 : 60); n++) {
        var button = document.createElement("button");
        button.type = "button";
        button.textContent = pad(n);
        button.dataset.part = index;
        button.value = n;
        button.setAttribute("aria-label", n + unit);
        button.setAttribute("aria-pressed", n === selected[index]);
        values.appendChild(button);
      }
      column.appendChild(values);
      panel.appendChild(column);
    });
    input.closest(clock ? ".bar-row" : ".r2").appendChild(panel);
    panel.querySelectorAll('[aria-pressed="true"]').forEach(function (button) {
      var box = button.parentElement;
      box.scrollTop = button.getBoundingClientRect().top - box.getBoundingClientRect().top;
    });
  }
  document.addEventListener("focusin", function (event) {
    if (event.target.matches(timeInputs)) openOptions(event.target);
    else if (!panel.contains(event.target)) closeOptions();
  });
  document.addEventListener("click", function (event) {
    if (event.target.matches(timeInputs) && activeInput !== event.target) openOptions(event.target);
    else if (!event.target.matches(timeInputs) && !panel.contains(event.target)) closeOptions();
  });
  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape" && activeInput) {
      if (panel.contains(document.activeElement)) activeInput.focus();
      closeOptions();
    }
  });
  document.addEventListener("input", function (event) {
    if (activeInput !== event.target) return;
    var selected = selectedValues(activeInput);
    panel.querySelectorAll("button").forEach(function (button) {
      button.setAttribute("aria-pressed", +button.value === selected[button.dataset.part]);
    });
  });
  panel.addEventListener("click", function (event) {
    var button = event.target.closest("button");
    if (!button || !activeInput) return;
    event.stopPropagation();
    var input = activeInput;
    if (input === arrivalInput) {
      var parts = selectedValues(input);
      parts[button.dataset.part] = +button.value;
      input.value = parts.map(pad).join(":");
    } else input.value = button.value;
    input.dispatchEvent(new Event("input", { bubbles: true }));
    if (input !== arrivalInput) closeOptions();
  });

  function renderArrival() {
    var a = split(state.arrival, state.zone);
    arrivalInput.value = a.text;
    arrivalInput.classList.remove("invalid");
    $("arrival-err").hidden = true;
    $("arrival-zone").textContent = zoneName(state.zone);
    var lbl = dayLabel(a.day);
    $("arrival-day").textContent = lbl;
    $("zone-utc").setAttribute("aria-pressed", state.zone === "UTC");
    $("zone-jst").setAttribute("aria-pressed", state.zone === "JST");
  }

  function buildCards() {
    list.innerHTML = "";
    state.people.forEach(function (p, i) {
      var node = tpl.content.firstElementChild.cloneNode(true);
      node.dataset.id = p.id;
      ["name", "tm", "ts", "rm", "rs"].forEach(function (k) {
        node.querySelector("." + k).value = p[k];
      });
      node.querySelector(".del").hidden = state.people.length === 1;
      list.appendChild(node);
    });
    updateResults();
  }

  var copyLines = [];
  function updateResults() {
    copyLines = [];
    state.people.forEach(function (p, i) {
      var card = list.querySelector('[data-id="' + p.id + '"]');
      if (!card) return;
      var vals = {}, allOk = true;
      ["tm", "ts", "rm", "rs"].forEach(function (k) {
        var r = toNum(p[k]);
        vals[k] = r.n;
        card.querySelector("." + k).classList.toggle("invalid", !r.ok);
        if (!r.ok) allOk = false;
      });
      var start = state.arrival - (vals.rm * 60 + vals.rs) - (vals.tm * 60 + vals.ts);
      var s = split(start, state.zone);
      card.querySelector(".d").textContent = allOk ? dayLabel(s.day) : "";
      card.querySelector(".t").textContent = allOk ? s.text : "--:--:--";
      card.querySelector(".z").textContent = allOk ? zoneName(state.zone) : "";
      var nm = p.name.trim() || ("参加者" + (i + 1));
      var lbl = dayLabel(s.day);
      copyLines.push(nm + " " + (allOk ? (lbl ? lbl + " " : "") + s.text + " " + zoneName(state.zone) : "（入力エラー）"));
    });
    save();
  }

  // ---- イベント ----
  list.addEventListener("input", function (e) {
    var card = e.target.closest(".participant");
    if (!card) return;
    var p = state.people.find(function (x) { return String(x.id) === card.dataset.id; });
    if (!p) return;
    var key = ["name", "tm", "ts", "rm", "rs"].find(function (k) { return e.target.classList.contains(k); });
    if (!key) return;
    p[key] = e.target.value;
    updateResults();
  });
  list.addEventListener("click", function (e) {
    if (!e.target.classList.contains("del")) return;
    var card = e.target.closest(".participant");
    state.people = state.people.filter(function (x) { return String(x.id) !== card.dataset.id; });
    buildCards();
  });
  $("add").addEventListener("click", function () {
    state.people.push(newPerson());
    buildCards();
    var cards = list.querySelectorAll(".participant");
    var last = cards[cards.length - 1];
    last.scrollIntoView({ block: "nearest", behavior: "smooth" });
    last.querySelector(".name").focus({ preventScroll: true });
  });

  function applyArrivalInput(commit) {
    var sod = parseClock(arrivalInput.value);
    if (sod === null) {
      if (commit) { arrivalInput.classList.add("invalid"); $("arrival-err").hidden = false; }
      return;
    }
    arrivalInput.classList.remove("invalid");
    $("arrival-err").hidden = true;
    // いま表示中の日付（前日/翌日を含む）を保ったまま、その日の時刻を差し替える
    var day = split(state.arrival, state.zone).day;
    state.arrival = day * DAY + sod - OFFSETS[state.zone];
    var lbl = dayLabel(split(state.arrival, state.zone).day);
    $("arrival-day").textContent = lbl;
    updateResults();
    if (commit) arrivalInput.value = split(state.arrival, state.zone).text;
  }
  arrivalInput.addEventListener("input", function () { applyArrivalInput(false); });
  arrivalInput.addEventListener("change", function () { applyArrivalInput(true); });
  arrivalInput.addEventListener("keydown", function (e) { if (e.key === "Enter") { applyArrivalInput(true); arrivalInput.blur(); } });

  function setZone(z) {
    if (state.zone === z) return;
    applyArrivalInput(true);
    state.zone = z;
    renderArrival();
    updateResults();
  }
  $("zone-utc").addEventListener("click", function () { setZone("UTC"); });
  $("zone-jst").addEventListener("click", function () { setZone("JST"); });

  function copyDone(ok) {
    var btn = $("copy");
    btn.textContent = ok ? "✓ 完了" : "コピー";
    btn.classList.toggle("done", ok);
    clearTimeout(copyDone.t);
    copyDone.t = setTimeout(function () { btn.textContent = "コピー"; btn.classList.remove("done"); }, 1500);
  }
  function legacyCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.top = "0"; ta.style.left = "-9999px"; ta.style.fontSize = "16px";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    return ok;
  }
  function showManual(text) {
    // 自動コピーできない環境では、選択済みの一覧を出して手動コピーしてもらう
    var box = $("copy-box");
    box.value = text; box.hidden = false; box.focus(); box.select();
  }
  $("copy").addEventListener("click", function () {
    applyArrivalInput(true);
    var a = split(state.arrival, state.zone), al = dayLabel(a.day);
    var text = ["集結到着 " + (al ? al + " " : "") + a.text + " " + zoneName(state.zone), ""].concat(copyLines).join("\n");
    $("copy-box").hidden = true;
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { copyDone(true); }, function () {
        if (legacyCopy(text)) copyDone(true); else showManual(text);
      });
    } else if (legacyCopy(text)) { copyDone(true); } else { showManual(text); }
  });

  $("reset").addEventListener("click", function () {
    state = { zone: "UTC", arrival: 21 * 3600, people: [newPerson()] };
    renderArrival();
    buildCards();
  });

  // ---- 起動 ----
  if (!load()) state.people = [newPerson()];
  renderArrival();
  buildCards();
})();
</script>
</body>
</html>
